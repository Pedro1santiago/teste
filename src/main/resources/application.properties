spring.application.name=teste-backend
server.port=${PORT}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

simulation.creation-interval-ms=20000
simulation.advance-interval-ms=9000

sse.heartbeat-interval-ms=10000
sse.forced-disconnect-interval-ms=180000
sse.max-buffered-events=500
