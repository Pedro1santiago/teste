spring.application.name=teste-backend
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/teste_backend}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

simulation.creation-interval-ms=20000
simulation.advance-interval-ms=9000

sse.heartbeat-interval-ms=10000
sse.forced-disconnect-interval-ms=180000
sse.max-buffered-events=500
